# 复制为 config.local.toml；不要提交真实连接地址、账号或页面证据。
state_dir = "var"
profile_path = "profiles/template.toml"
adb_path = "adb"
database_url_env = "XHS_DATABASE_URL"

[devices.lab01]
serial_env = "XHS_ADB_SERIAL"
session_ref = "lab-session-01"
# doctor 可留空并列出安装包；实际采集必须填写实机确认的小红书包名。
app_package = ""
# 可选：桌面 App 中“打开云手机”的入口；不用于自动登录或解除限制。
cloud_console_url = "https://wya.wuying.aliyun.com/instanceLayouts"

[policy]
action_interval = 3
page_timeout = 30
max_retries = 2
cooldown_seconds = 1800
max_detail_visits = 100
max_list_swipes = 50
max_no_progress = 3

# 新任务按目标生成预算；上面 100/50 是旧版策略模板，不限制新任务目标。
# 详情 = max(100, 目标 * 3)，列表 = max(50, 向上取整(详情 / 2))。
# 历史任务继续使用数据库中已保存的预算，恢复不会重新计算。
[task_limits]
max_detail_visits = 1500
max_list_swipes = 750
