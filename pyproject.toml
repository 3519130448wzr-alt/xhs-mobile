[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xhs-mobile"
version = "0.5.0"
description = "Evidence-grounded single-device Android Xiaohongshu collection toolkit"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13,<2",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "typer>=0.12,<1",
  "uiautomator2>=3.2,<4",
  "pillow>=10,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
xhs-mobile = "xhs_mobile.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/xhs_mobile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL pointing to an isolated PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
